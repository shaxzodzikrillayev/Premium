<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

  <defs>

    <radialGradient id="bg" cx="50%" cy="35%">
      <stop offset="0%" stop-color="#1d1d1d"></stop>
      <stop offset="100%" stop-color="#030303"></stop>
    </radialGradient>

    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D0"></stop>
      <stop offset="0.2" stop-color="#F7E08A"></stop>
      <stop offset="0.45" stop-color="#D4AF37"></stop>
      <stop offset="0.7" stop-color="#A67C1B"></stop>
      <stop offset="1" stop-color="#FFF1B8"></stop>
    </linearGradient>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"></feGaussianBlur>
    </filter>

  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"></rect>

  <!-- Glow -->
  <circle cx="256" cy="256" r="170" fill="#D4AF37" opacity="0.08" filter="url(#shadow)"></circle>

  <!-- Shield -->
  <path d="
      M256 70
      L380 120
      V250
      C380 345 332 408 256 448
      C180 408 132 345 132 250
      V120
      Z" fill="none" stroke="url(#gold)" stroke-width="10"></path>

  <!-- Crown -->
  <path d="
      M188 120
      L220 82
      L256 125
      L292 82
      L324 120
      L316 150
      L196 150
      Z" fill="url(#gold)"></path>

  <!-- M -->
  <path d="
      M175 345
      V175
      L230 265
      L256 215
      L282 265
      L337 175
      V345
      H307
      V240
      L256 315
      L205 240
      V345
      Z" fill="url(#gold)"></path>

  <!-- P -->
  <path d="
      M275 175
      H322
      C355 175 375 194 375 225
      C375 258 355 276 322 276
      H305
      V345
      H275
      Z

      M305 203
      V248
      H320
      C336 248 345 240 345 225
      C345 210 336 203 320 203
      Z" fill="url(#gold)"></path>

  <!-- Shine -->
  <path d="M120 120 L250 40" stroke="white" stroke-width="18" opacity="0.05"></path>

</svg>