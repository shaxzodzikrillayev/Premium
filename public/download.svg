<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="luxuryGold" x1="0" y1="0" x2="512" y2="512">
    <stop stop-color="#FFF6C7"></stop>
    <stop offset="0.25" stop-color="#E7C66A"></stop>
    <stop offset="0.55" stop-color="#B8862F"></stop>
    <stop offset="0.8" stop-color="#F5D982"></stop>
    <stop offset="1" stop-color="#FFF0A3"></stop>
  </linearGradient>


  <radialGradient id="bgGlow">
    <stop stop-color="#D4AF37" stop-opacity=".35"></stop>
    <stop offset="1" stop-color="#000" stop-opacity="0"></stop>
  </radialGradient>


  <filter id="shadow">
    <feGaussianBlur stdDeviation="10"></feGaussianBlur>
  </filter>

</defs>


<!-- luxury glow -->

<circle cx="256" cy="256" r="210" fill="url(#bgGlow)"></circle>


<!-- outer gold ring -->

<circle cx="256" cy="256" r="190" stroke="url(#luxuryGold)" stroke-width="6"></circle>


<!-- thin inner ring -->

<circle cx="256" cy="256" r="165" stroke="#D4AF37" stroke-opacity=".35" stroke-width="2"></circle>


